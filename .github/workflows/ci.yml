name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rust-version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.rust-version.outputs.version }} test --workspace --all-targets --locked

  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned check toolchain
        run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: sh tools/check.sh
      - run: python -m pip install maturin pytest
      - run: maturin build --release --out dist
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: pytest python/tests

  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Python prerequisites
        run: apt-get update -q && apt-get install -y -q curl ca-certificates gcc g++ python3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked --features cuda
      - run: cargo check -p chuda --no-default-features --features cuda --all-targets --locked
